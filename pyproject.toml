[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chronicle-jiashen"
version = "0.1.0"
description = "Chronicle: 甲申 — a bounded historical observatory for persistent Hermes lifetimes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "mcp>=1.28,<2",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
chronicle = "chronicle.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
]

[tool.uv]
default-groups = ["dev"]
package = true

[tool.setuptools.packages.find]
include = ["chronicle*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["artifacts", ".chronicle"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
