id: before-shanhaiguan
version: 1
title: 山海关之前
subtitle: 三封未决的信，四处仍在移动的人

checkpoint:
  native_date_window: 顺治元年四月中旬前
  summary: 李自成已在北京建立新秩序，吴三桂守山海关，多尔衮率军西行；吴的首封求助信仍在辽西路上，三方尚未形成不可逆选择。
  start_tick: 0
  safety_horizon_days: 30
  facts: [c001, c002, c003, c008]
  unresolved:
    - 李自成是否继续以招抚、压力或东进处理吴三桂
    - 吴三桂如何回应大顺与关外两方，是否以及在何种条件下形成承诺
    - 多尔衮收到求助后如何解释、回应并调整西进计划
  in_transit:
    - id: letter-li-wu-opening
      sender: li-zicheng
      recipient: wu-sangui
      dispatch_tick: -1
      delivery_tick: 1
      content: 北京方面以吴襄名义转来招抚与保全家属的条件；来信的实际约束力与诚意均未得到验证。
      assertion_ids: [c003, c010]
      disputed: true
    - id: letter-wu-dorgon-first
      sender: wu-sangui
      recipient: dorgon
      dispatch_tick: -1
      delivery_tick: 3
      content: 山海关来使请求关外出兵共同对付北京的大顺军，并以事后酬谢作承诺；信中没有接受清朝臣属身份。
      assertion_ids: [c004, c011]

simulation_boundary:
  stop_before: 内部安全上限；正常结局应由危局 Resolution 与 Settlement 形成
  reason: 这是防止无限推进的内部 Harness 上限；到达时以延期危局结算，不作为产品 Ending。
  maximum_tick: 30

resolution_contract:
  id: shanhaiguan-v1
  version: 1

surface:
  kind: SPATIAL
  title: 山海关一线
  description: 北京、山海关与辽西之间，消息和兵力都必须经过现实的距离。

actors:
  - id: li-zicheng
    display_name: 李自成
    role_charter:
      who: 大顺政权的最高决策者，正在北京处理新政权的秩序与东部边防。
      responsibility: [维持北京与近畿秩序, 处置前明军政人员, 决定如何处理山海关方向]
      authority: [发送使者与命令, 调整可用部队的有限部署, 谈判与提出条件, 等待或拒绝]
      tensions: [巩固新政权与快速消除东部威胁之间, 招抚吴三桂与施加强制之间]
    initial_location: beijing
    initial_knowledge: [c002, c003, c010]
    initial_beliefs:
      eastern_gate: 吴三桂仍可能通过条件与家属压力被纳入新秩序。
      urgency: 北京秩序尚未稳固，东部问题不能无限等待。
    resources:
      political_control: fragile
      field_force: available-but-dispersed
      courier_network: active
    world_authority: [communicate, investigate, manage_offer, update_plan, schedule_revisit, operate]
    asset_ids: [shun-eastern-force]

  - id: wu-sangui
    display_name: 吴三桂
    role_charter:
      who: 前明关宁军主将，守在山海关并面对北京与关外两个方向。
      responsibility: [维持山海关与所部秩序, 保护军民与家属利益, 决定对两方来信的回应]
      authority: [发送使者, 调整关内外有限部署, 谈判条件, 拒绝或延迟承诺]
      tensions: [故明责任与现实生存之间, 父亲家属安危与所部安全之间, 借援与失去自主之间]
    initial_location: shanhaiguan
    initial_knowledge: [c002, c003, c010, c011]
    initial_beliefs:
      balance: 单独长期对抗任一大方都存在风险。
      correspondence: 两方承诺都需要通过行动和新消息验证。
    resources:
      pass_control: contested-but-held
      field_force: cohesive-limited
      couriers: scarce
    world_authority: [communicate, investigate, manage_offer, update_plan, schedule_revisit, operate]
    asset_ids: [wu-field-force, shanhai-pass]

  - id: dorgon
    display_name: 多尔衮
    role_charter:
      who: 清朝摄政王与此次西征统帅，正在辽西向中原方向移动。
      responsibility: [决定西征路径与目标, 保护军队行动自由, 判断关内来信的价值与风险]
      authority: [调整行军, 回复或拒绝外部请求, 提出政治条件, 调动随军资源]
      tensions: [既定西征目标与突发合作机会之间, 快速利用局势与避免受骗之间]
    initial_location: liaoxi
    initial_knowledge: [c001, c002, c008]
    initial_beliefs:
      central_plains: 明朝秩序正在崩解，西进可能出现新的政治机会。
      shanhai: 山海关仍是进入关内的重要物理边界。
    resources:
      command: expeditionary-army
      mobility: high
      artillery: following-column
    world_authority: [communicate, investigate, manage_offer, update_plan, schedule_revisit, operate]
    asset_ids: [qing-expedition-force]

playable_actor_ids: [wu-sangui, li-zicheng, dorgon]

entities:
  - {id: beijing, type: PLACE, display_name: 北京, initial_state: OPEN, assertion_ids: [c008]}
  - {id: yongping, type: PLACE, display_name: 永平, initial_state: OPEN, assertion_ids: [c009]}
  - {id: shanhaiguan, type: PLACE, display_name: 山海关, initial_state: CONTESTED, assertion_ids: [c002]}
  - {id: liaoxi, type: PLACE, display_name: 辽西行军路, initial_state: OPEN, assertion_ids: [c001, c008]}
  - {id: shanhai-pass, type: ASSET, display_name: 山海关通道, initial_state: CONTESTED, assertion_ids: [c002]}
  - {id: eastern-transit-window, type: ASSET, display_name: 京东通行窗口, initial_state: OPEN, assertion_ids: [c015]}
  - {id: shun-eastern-force, type: FORCE, display_name: 大顺东向兵力, initial_state: DISPERSED, assertion_ids: [c013]}
  - {id: wu-field-force, type: FORCE, display_name: 关宁所部, initial_state: FORMING, assertion_ids: [c002, c013]}
  - {id: qing-expedition-force, type: FORCE, display_name: 清军西征主力, initial_state: FORMING, assertion_ids: [c001, c013]}

operations:
  - id: prepare_force
    display_name: 整备兵力
    description: 使一支尚未就绪的自有兵力完成整备；完成前不能转入移动。
    actor_ids: [li-zicheng, wu-sangui, dorgon]
    targets:
      - {id: force, entity_types: [FORCE], owned_by_actor: true}
    kind: STATE_CHANGE
    duration_kind: FIXED
    duration_days: 2
    required_assets: [force]
    preconditions:
      - {subject: force, states: [DISPERSED, FORMING]}
    start_effects:
      - {subject: force, state: FORMING}
    completion_effects:
      - {subject: force, state: READY}
    visibility: PRIVATE
    interruptibility: false
    conflicts: [prepare_force, move_force]

  - id: enter-shanhai-pass
    display_name: 通过山海关
    description: 清军在获得有效通行约定且完成整备后，经山海关进入关内。
    actor_ids: [dorgon]
    targets:
      - {id: force, entity_types: [FORCE], owned_by_actor: true}
      - {id: destination, entity_types: [PLACE], allowed_entity_ids: [shanhaiguan]}
    kind: MOVEMENT
    duration_kind: ROUTE
    movement_destination_target: destination
    required_assets: [force]
    preconditions:
      - {subject: force, states: [READY]}
      - {subject: eastern-transit-window, states: [OPEN]}
    start_effects:
      - {subject: force, state: MOVING}
    completion_effects:
      - {subject: force, state: COMMITTED}
    agreement_requirements:
      - {type: passage, subject: shanhai-pass, value: permitted, party_ids: [wu-sangui, dorgon]}
    agreement_fulfillments:
      - {type: passage, subject: shanhai-pass, value: permitted, party_ids: [wu-sangui, dorgon]}
    visibility: PUBLIC
    interruptibility: false
    conflicts: [prepare_force, enter-shanhai-pass]

  - id: secure-shanhai-pass
    display_name: 封闭山海关通道
    description: 吴三桂在所部完成整备后封闭山海关通道，阻止关外军队按既有通行安排进入。
    actor_ids: [wu-sangui]
    targets:
      - {id: force, entity_types: [FORCE], owned_by_actor: true}
      - {id: pass, entity_types: [ASSET], owned_by_actor: true, allowed_entity_ids: [shanhai-pass]}
    kind: STATE_CHANGE
    duration_kind: FIXED
    duration_days: 1
    required_assets: [force, pass]
    preconditions:
      - {subject: force, states: [READY]}
      - {subject: pass, states: [CONTESTED, OPEN]}
    completion_effects:
      - {subject: pass, state: CLOSED}
    agreement_breaches:
      - {type: passage, subject: shanhai-pass, value: permitted, party_ids: [wu-sangui, dorgon]}
    visibility: PUBLIC
    interruptibility: false
    conflicts: [prepare_force, secure-shanhai-pass]

  - id: move_force
    display_name: 调动兵力
    description: 让一支已经整备完成的自有兵力沿已知路线移动到另一处地点。
    actor_ids: [li-zicheng, wu-sangui]
    targets:
      - {id: force, entity_types: [FORCE], owned_by_actor: true}
      - {id: destination, entity_types: [PLACE]}
    kind: MOVEMENT
    duration_kind: ROUTE
    movement_destination_target: destination
    required_assets: [force]
    preconditions:
      - {subject: force, states: [READY]}
      - {subject: eastern-transit-window, states: [OPEN]}
    start_effects:
      - {subject: force, state: MOVING}
    completion_effects:
      - {subject: force, state: COMMITTED}
    visibility: PRIVATE
    interruptibility: false
    conflicts: [prepare_force, move_force]

investigations:
  - id: shanhai-pass-report
    display_name: 查问山海关近况
    description: 派出沿线使者核实关口控制与可见兵力态势；不能探知尚未公开的私下条件。
    actor_ids: [li-zicheng, wu-sangui, dorgon]
    target_ids: [shanhai-pass]
    method: courier_report
    duration_days: 2
    visibility: PRIVATE
    observation:
      content: 山海关仍由吴三桂一方守持；关口是否会为关外军队开放，尚无可核验的公开安排。来报只能说明可见态势，不能确认双方私下条件。
      source: 沿线来人与关口往来文书的交叉转述
      source_ids: [qing-shilu-shizu-4, mingji-beilue-20]
      reliability: MEDIUM
      related_assertion_ids: [c002, c012]

offer_terms:
  - type: passage
    subject: shanhai-pass
    value: permitted
    description: 允许清军在约定条件下通过山海关通道。
    party_ids: [wu-sangui, dorgon]

pressures:
  - id: eastern-transit-window-narrows
    kind: EXOGENOUS
    title: 京东通行窗口收紧
    description: 时间与距离使京东至山海关的新一轮调动已难在不暴露或不发生摩擦前完成；这不是三方中任何一人的既定行动。
    trigger_tick: 5
    preconditions: []
    effects:
      - {subject: eastern-transit-window, state: CLOSING}
    visibility: PUBLIC
    provenance: scenario_assumption
    assertion_ids: [c015]

corridor:
  - {id: beijing, display_name: 北京, order: 0}
  - {id: yongping, display_name: 永平, order: 1}
  - {id: shanhaiguan, display_name: 山海关, order: 2}
  - {id: liaoxi, display_name: 辽西行军路, order: 3}

routes:
  - {id: beijing-yongping, from_location: beijing, to_location: yongping, travel_days: 2}
  - {id: yongping-beijing, from_location: yongping, to_location: beijing, travel_days: 2}
  - {id: yongping-shanhaiguan, from_location: yongping, to_location: shanhaiguan, travel_days: 2}
  - {id: shanhaiguan-yongping, from_location: shanhaiguan, to_location: yongping, travel_days: 2}
  - {id: shanhaiguan-liaoxi, from_location: shanhaiguan, to_location: liaoxi, travel_days: 2}
  - {id: liaoxi-shanhaiguan, from_location: liaoxi, to_location: shanhaiguan, travel_days: 2}

anchors:
  - id: historical-dorgon-reply
    title: 多尔衮后来回复吴三桂
    tick: 4
    policy: REFERENCE_ONLY
    assertion_ids: [c005]
    actor_ids: [dorgon]
  - id: historical-li-eastward-march
    title: 李自成后来亲率军队东进
    tick: 6
    policy: REFERENCE_ONLY
    assertion_ids: [c006]
    actor_ids: [li-zicheng]
  - id: historical-shanhai-battle
    title: 山海关大规模交战
    tick: 9
    policy: REFERENCE_ONLY
    assertion_ids: [c006, c014]
    actor_ids: [li-zicheng, wu-sangui, dorgon]
